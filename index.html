<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiaan's World Explorer</title><style>
*{box-sizing:border-box}body{margin:0;background:#102b22;color:white;font:bold 16px system-ui;text-align:center}main{max-width:1600px;margin:auto;padding:8px;display:flex;flex-direction:column;gap:8px;height:100vh;height:100dvh}header{color:#ffe36b;font-size:clamp(18px,3vw,32px)}#stage{position:relative;flex:1;min-height:160px;background:#101c17;border:4px solid #85b84c;overflow:hidden}#photo,#tiles{position:absolute;inset:0;width:100%;height:100%}#photo{object-fit:contain}#tiles{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}.tile{background:linear-gradient(#80bb39 0 23%,#477d22 23% 29%,#795133 29%);border:2px solid #3b3925;box-shadow:inset 5px 5px #ffffff22;display:grid;place-items:center;font-size:clamp(22px,5vw,48px);color:#f7e4a6;transition:opacity .35s}.gone{opacity:0}button{font:inherit;border:0;border-radius:6px;padding:10px 14px;background:#e6bf43;color:#192a17;cursor:pointer}button:disabled{opacity:.45}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}#answer{color:#ffe36b;font-size:clamp(18px,3vw,34px);min-height:1.3em}#credit{font-size:12px;color:#c6d8c8}#credit a{color:inherit}#status{position:absolute;inset:0;display:grid;place-content:center;background:#153c2c;z-index:2;padding:16px}#status[hidden]{display:none}
</style></head><body><main><header>KIAAN'S WORLD EXPLORER · <span id="round"></span></header><div id="stage"><img id="photo" alt=""><div id="tiles"></div><div id="status" hidden></div></div><div id="answer" aria-live="polite"></div><nav><button id="play" onclick="toggle()">▶ Start</button><button id="one" onclick="step()">Reveal block</button><button id="show" onclick="show()">Show answer</button><button onclick="next()">Next →</button><button onclick="full()">Fullscreen</button></nav><div id="credit" hidden></div></main><script>
const P=(d,c='#d9c5a3',s='#685d4c')=>`<path d="${d}" fill="${c}" stroke="${s}" stroke-width="2"/>`, R=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`, C=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;const tower=(x,y,w,h,c)=>R(x,y,w,h,c)+R(x-5,y,w+10,8,'#75654e');const statue=(c,arms)=>R(250,310,100,55,'#aaa49a')+P('M270 310 L282 150 L318 150 L330 310Z',c)+C(300,125,20,c)+arms;const dome=(x,y,w,h)=>P(`M${x-w/2} ${y} Q${x-w/2} ${y-h*.65} ${x} ${y-h} Q${x+w/2} ${y-h*.65} ${x+w/2} ${y}Z`,'#f5eee0');
const data=[
['Eiffel Tower','France','Built for the 1889 World’s Fair.',P('M295 30H305L310 100 325 175 350 240 405 340H355L330 290Q300 250 270 290L245 340H195L250 240 275 175 290 100Z','#8c7151')+R(250,235,100,10,'#594a38')+R(275,170,50,8,'#594a38')+Array.from({length:8},(_,i)=>P(`M${290-i*7} ${100+i*24}L${310+i*7} ${124+i*24}L${283-i*7} ${124+i*24}`,'none','#d6bb90')).join('')],
['Statue of Liberty','USA','The statue was a gift from France.',statue('#69a99a',P('M282 170L245 120 235 65 248 60 262 115 300 155Z','#69a99a')+R(229,48,22,20,'#69a99a')+P('M229 48L240 23 251 48Z','#ffc34a')+P('M315 165L345 190 332 240 315 225Z','#69a99a')+P('M278 123L267 95 286 108 292 83 300 105 315 85 315 110 336 98 322 124Z','#69a99a'))],
['Statue of Unity','India','It honors Sardar Vallabhbhai Patel.',statue('#a28b70',P('M282 155L260 190 254 285 270 290 290 210Z','#a28b70')+P('M318 155L340 190 346 285 330 290 310 210Z','#a28b70')+P('M282 150L305 190 290 305 275 305Z','#c2ab90'))],
['Christ the Redeemer','Brazil','It overlooks Rio de Janeiro.',statue('#e6e3da',P('M285 150L125 150 125 172 280 183 320 183 475 172 475 150 315 150Z','#e6e3da'))],
['Taj Mahal','India','It is made largely of white marble.',R(190,205,220,140,'#f7efe0')+dome(300,205,150,120)+R(294,65,12,30,'#b5a17a')+[135,450].map(x=>tower(x,145,18,200,'#eee4d1')+dome(x+9,145,32,25)).join('')+P('M270 345V260Q300 210 330 260V345Z','#756e65')],
['Leaning Tower of Pisa','Italy','Its famous tilt began during construction.',`<g transform="rotate(12 300 340)">${R(245,75,110,265,'#eee5d3')}${Array.from({length:7},(_,i)=>R(235,90+i*34,130,8,'#b4a58b')+Array.from({length:5},(_,j)=>P(`M${250+j*20} ${115+i*34}v-15q7 -12 14 0v15Z`,'#827d70')).join('')).join('')}</g>`],
['Big Ben','United Kingdom','Big Ben is the nickname of the great bell.',R(250,115,100,230,'#c4a36d')+P('M240 115L300 35 360 115Z','#665a47')+C(300,155,35,'#fff6d7')+P('M300 130V155L320 165','none','#333')+R(270,205,12,130,'#8b754e')+R(318,205,12,130,'#8b754e')],
['Great Pyramid of Giza','Egypt','It is the oldest of the Seven Wonders of the Ancient World.',P('M65 330L270 70 480 330Z','#d8b477')+P('M270 70L480 330 550 300Z','#b38a50')],
['Burj Khalifa','UAE','It is the tallest building in the world.',P('M220 345V240H240V175H260V120H280V70H294V20H302V70H315V140H335V205H355V270H375V345Z','#a4c9d9')+Array.from({length:12},(_,i)=>R(285,85+i*20,12,10,'#587e96')).join('')],
['India Gate','India','It is a war memorial in New Delhi.',R(185,125,230,215,'#c7a37b')+R(170,105,260,30,'#b9956e')+R(215,75,170,30,'#d6b28a')+P('M260 340V225Q300 165 340 225V340Z','#8bd4fa')],
['Colosseum','Italy','It was an ancient Roman amphitheater.',P('M100 340V150Q300 70 500 150V340Z','#c5a27b')+Array.from({length:3},(_,i)=>Array.from({length:8},(_,j)=>P(`M${120+j*47} ${200+i*65}v-28q15 -25 30 0v28Z`,'#6f6558')).join('')).join('')],
['Great Wall of China','China','It stretches across mountains and valleys.',P('M0 340L180 100 360 260 600 65V135L360 330 180 170 0 400Z','#b6a58b')+[ [155,85],[335,240],[525,65]].map(([x,y])=>R(x,y,55,65,'#9b8a72')+Array.from({length:3},(_,j)=>R(x+j*20,y-12,15,15,'#9b8a72')).join('')).join('')],
['Mount Rushmore','USA','Four US presidents are carved into the mountain.',P('M40 350L100 100 220 70 330 95 470 65 560 350Z','#aaa69f')+[150,245,340,435].map((x,i)=>C(x,155+i%2*25,42,'#d4d0c7')+R(x-7,150+i%2*25,14,35,'#b0aca4')+R(x-25,145+i%2*25,12,5,'#68645f')+R(x+13,145+i%2*25,12,5,'#68645f')).join('')],
['Moai Statues','Chile','These stone figures stand on Easter Island.',[150,300,450].map(x=>P(`M${x-40} 340L${x-30} 215 ${x-40} 100 ${x+30} 90 ${x+40} 210 ${x+30} 340Z`,'#99988a')+P(`M${x-15} 130L${x+10} 130 ${x+20} 190 ${x-15} 190Z`,'#77796e')).join('')],
['Merlion','Singapore','It combines a lion head and a fish body.',P('M235 330Q350 310 330 230L315 180 255 180 240 245 200 285Z','#eee9d9')+C(290,145,58,'#d7d2c4')+C(270,145,38,'#f5f0e4')+C(255,135,5,'#333')+P('M240 160Q110 175 50 330','none','#fff')],
['Petra','Jordan','Its Treasury is carved into sandstone cliffs.',R(75,30,450,320,'#c98966')+R(155,155,290,190,'#e2a47e')+P('M145 155L300 80 455 155Z','#eab18a')+[175,230,350,405].map(x=>tower(x,160,18,185,'#f2ba90')).join('')+R(275,240,50,105,'#684334')],
['Sydney Opera House','Australia','Its roof is famous for its sail-like shells.',R(100,310,400,35,'#a79b83')+[130,235,340].map((x,i)=>P(`M${x} 310Q${x+15} ${90+i*25} ${x+100} ${120+i*20}Q${x+65} 230 ${x+140} 310Z`,'#f8f5e7')).join('')],
['Adiyogi Statue','India','The large bust stands near Coimbatore.',P('M120 345Q135 250 250 240L250 190 350 190 350 240Q465 250 480 345Z','#343b43')+C(300,155,82,'#343b43')+C(300,65,45,'#343b43')+P('M260 155H285M315 155H340M285 205Q300 212 315 205','none','#a9adb1')+R(288,112,24,5,'#eee')]
];

const titles=['Eiffel Tower','Statue of Liberty','Statue of Unity','Christ the Redeemer (statue)','Taj Mahal','Leaning Tower of Pisa','Big Ben','Great Pyramid of Giza','Burj Khalifa','India Gate','Colosseum','Great Wall of China','Mount Rushmore','Moai','Merlion','Petra','Sydney Opera House','Adiyogi Shiva bust'];
const $=id=>document.getElementById(id);let idx=0,n=0,order=[],timer=null,ready=false,answered=false,token=0,audio,source;const cache=new Map();
async function photoFor(i){if(cache.has(i))return cache.get(i);const p=(async()=>{const q=new URLSearchParams({action:'query',format:'json',origin:'*',redirects:'1',prop:'pageimages',piprop:'thumbnail|name',pithumbsize:'1200',pilicense:'free',titles:titles[i]});const res=await fetch('https://en.wikipedia.org/w/api.php?'+q);if(!res.ok)throw Error('Photo unavailable');const j=await res.json();const page=Object.values(j.query.pages)[0];if(!page.thumbnail||!page.pageimage)throw Error('Photo unavailable');return {url:page.thumbnail.source,file:page.pageimage}})();cache.set(i,p);try{return await p}catch(e){cache.delete(i);throw e}}
function beep(win=false){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=win?880:330+n*18;g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.start();o.stop(audio.currentTime+.18)}catch(e){}}
function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ Start / resume'}
function controls(){for(const id of ['play','one','show'])$(id).disabled=!ready||answered; if(n===16){$('play').disabled=true;$('one').disabled=true}}
async function load(){const t=++token;stop();ready=false;answered=false;n=0;source=null;order=Array.from({length:16},(_,i)=>i);for(let i=15;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}$('tiles').innerHTML=order.map(()=>'<div class="tile">?</div>').join('');$('photo').removeAttribute('src');$('round').textContent=(idx+1)+' / '+data.length;$('answer').textContent='Guess the monument!';$('credit').hidden=true;$('status').hidden=false;$('status').textContent='Loading photograph…';controls();try{const p=await photoFor(idx);const img=new Image();img.src=p.url;await img.decode();if(t!==token)return;source=p;$('photo').src=p.url;ready=true;$('status').hidden=true;controls();if(idx+1<data.length)photoFor(idx+1).catch(()=>{});}catch(e){if(t!==token)return;$('status').textContent='Could not load photograph. Check internet or try again.';const b=document.createElement('button');b.textContent='Retry';b.onclick=load;$('status').append(b);}}
function step(){if(!ready||answered||n>=16){stop();return}$('tiles').children[order[n++]].classList.add('gone');beep();if(n===16)stop();controls()}
function toggle(){if(!ready||answered||n>=16)return;if(timer){stop();return}step();if(n<16){timer=setInterval(step,2000);$('play').textContent='Ⅱ Pause'}}
function show(){if(!ready||answered)return;stop();answered=true;n=16;for(const t of $('tiles').children)t.classList.add('gone');$('answer').textContent=data[idx][0]+' · '+data[idx][1];const a=document.createElement('a');a.href='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(source.file.replace(/ /g,'_'));a.target='_blank';a.rel='noopener';a.textContent='Photo source, author and license';$('credit').replaceChildren(a);$('credit').hidden=false;controls();beep(true)}
function next(){if(idx<data.length-1){idx++;load()}else if(confirm('Adventure complete! Play again?')){idx=0;load()}}
function full(){if(document.fullscreenElement)document.exitFullscreen?.();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else alert('On iPhone, rotate to landscape for a larger view.')}
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.key===' ')return;const k=e.key.toLowerCase();if(k===' '){e.preventDefault();toggle()}if(k==='r')step();if(k==='a')show();if(k==='n')next();if(k==='f')full()});load();
</script></body></html>
