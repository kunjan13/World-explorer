<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiaan – Grand Entrance</title><style>*{box-sizing:border-box}body{margin:0;background:#07130d;color:#fff;font:bold 16px system-ui}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}video{width:100%;max-height:85vh;background:#000}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button,a{font:inherit;background:#ffe36b;color:#193527;border:0;border-radius:8px;padding:12px;text-decoration:none}p{margin:0;text-align:center}</style></head><body><main><video id="v" src="entrance-video.mp4" controls playsinline preload="metadata"></video><nav><button id="play">Play from beginning</button><button id="full">Fullscreen</button><a href="./">Home</a></nav><p id="status" role="status">Grand entrance · Plays once</p></main><script>const v=document.getElementById('v'),status=document.getElementById('status');document.getElementById('play').onclick=()=>{v.currentTime=0;v.play().catch(()=>status.textContent='Tap the video play control to start.')};document.getElementById('full').onclick=()=>{if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()};v.addEventListener('error',()=>status.textContent='Entrance video not available. Upload entrance-video.mp4 to the repository.');v.addEventListener('ended',()=>status.textContent='Entrance complete.');</script></body></html>
