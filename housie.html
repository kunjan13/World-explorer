<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Housie</title><style>*{box-sizing:border-box}body{margin:0;background:#102b22;color:white;font:bold 16px system-ui;text-align:center}main{max-width:1400px;margin:auto;padding:55px 12px 12px}h1{color:#ffe36b;margin:0;font-size:clamp(24px,4vw,42px)}#number{font-size:clamp(75px,16vh,180px);line-height:1.1;color:#ffe36b}#board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:12px auto;max-width:1000px}.cell{background:#254735;border:1px solid #52764b;border-radius:4px;padding:clamp(4px,1vh,10px);font-size:clamp(15px,2.5vw,30px);color:#b7c9b8}.called{background:#85b84c;color:#102b22}.latest{background:#ffe36b;color:#102b22;outline:2px solid white}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button,a{font:inherit;background:#ffe36b;color:#192a17;border:0;border-radius:6px;padding:10px 16px;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}#history{min-height:24px;color:#d9efcb}#count{color:#d9efcb}</style></head><body><main><h1>HOUSIE · LEVEL 7</h1><div id="number" aria-live="polite">?</div><div id="count"></div><div id="board"></div><div id="history"></div><nav><button id="draw" onclick="draw()">Next number</button><button onclick="repeat()">Repeat number</button><button id="auto" onclick="auto()">Auto call</button><button onclick="reset()">New game</button><button onclick="full()">Fullscreen</button><a href="./">Home</a></nav></main><script>const $=id=>document.getElementById(id);let called=[],timer=null;try{const a=JSON.parse(localStorage.getItem('housie-called'));if(Array.isArray(a)&&a.every(n=>Number.isInteger(n)&&n>=1&&n<=90)&&new Set(a).size===a.length)called=a}catch(e){}function render(){const last=called.at(-1);$('number').textContent=last??'?';$('count').textContent=called.length+' / 90 numbers called';$('board').replaceChildren(...Array.from({length:90},(_,i)=>{const d=document.createElement('div');d.className='cell'+(called.includes(i+1)?' called':'')+(last===i+1?' latest':'');d.textContent=i+1;return d}));$('history').textContent='Recent: '+called.slice(-8).reverse().join(' · ');$('draw').disabled=called.length===90;$('auto').disabled=called.length===90;try{localStorage.setItem('housie-called',JSON.stringify(called))}catch(e){}}function repeat(){if(!called.length||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(called.at(-1)));u.lang='en-IN';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}function stop(){clearInterval(timer);timer=null;$('auto').textContent='Auto call'}function draw(){const left=Array.from({length:90},(_,i)=>i+1).filter(n=>!called.includes(n));if(!left.length){stop();return}called.push(left[Math.floor(Math.random()*left.length)]);render();repeat();if(called.length===90)stop()}function auto(){if(timer){stop();return}draw();if(called.length<90){timer=setInterval(draw,8000);$('auto').textContent='Pause auto'}}function reset(){if(confirm('Clear all called numbers and start a new game?')){stop();called=[];render()}}function full(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})}document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='SELECT'&&e.target.tagName!=='INPUT'){e.preventDefault();draw()}});render();</script><script src="party-music.js?v=11"></script></body></html>
