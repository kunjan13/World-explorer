<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emoji Movie Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:#102b22;color:white;font:bold 16px system-ui;text-align:center}main{height:100vh;height:100dvh;max-width:1600px;margin:auto;display:flex;flex-direction:column;gap:10px;padding:12px}header{font-size:clamp(20px,4vw,38px);color:#ffe36b}#stage{flex:1;min-height:140px;display:flex;align-items:center;justify-content:center;gap:clamp(5px,2vw,30px);background:#193d2b;border:4px solid #85b84c;border-radius:8px;padding:12px}.tile{display:grid;place-items:center;width:23%;max-width:240px;aspect-ratio:1;font-size:clamp(28px,10vw,130px);background:linear-gradient(#80bb39 0 23%,#477d22 23% 29%,#795133 29%);border:3px solid #3b3925;border-radius:5px;color:#ffe36b}.open{background:#fff8df;border-color:#e6bf43}#answer{font-size:clamp(22px,4vw,46px);color:#ffe36b;min-height:1.4em}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}button,a{font:inherit;border:0;border-radius:6px;padding:10px 14px;background:#e6bf43;color:#192a17;cursor:pointer;text-decoration:none}button:disabled{opacity:.45}</style></head><body><main><header>🎬 GUESS THE BOLLYWOOD MOVIE · <span id="round"></span></header><div id="stage"></div><div id="answer" aria-live="polite"></div><nav><button id="play" onclick="toggle()">▶ Start</button><button id="one" onclick="step()">Reveal emoji</button><button id="show" onclick="show()">Show answer</button><button onclick="next()">Next →</button><button onclick="full()">Fullscreen</button><a href="./">Home</a></nav></main><script>
const movies=[["3 Idiots","3️⃣","🎓","👨‍🎓"],["Taare Zameen Par","⭐","🌍","🎨"],["Dangal","🤼","👧","🏅"],["Koi Mil Gaya","👽","🛸","👦"],["Krrish","🦸","🎭","🏙️"],["Bajrangi Bhaijaan","👧","🙏","🚌"],["Chennai Express","🚆","👫","🌴"],["Chak De! India","🏑","🇮🇳","🏆"],["Lagaan","🏏","🌾","☀️"],["PK","👽","📻","❓"],["Jab We Met","🚆","👩","❤️"],["Dilwale Dulhania Le Jayenge","❤️","👰","🚆"],["Kabhi Khushi Kabhie Gham","😊","😢","👨‍👩‍👧‍👦"],["Hum Aapke Hain Koun","💒","🐕","❓"],["Bhootnath","👻","👦","🏠"],["Bhoothnath Returns","👻","🔙","🗳️"],["Chillar Party","🧒","🐕","🎉"],["Stanley Ka Dabba","👦","🍱","🏫"],["Bunty Aur Babli","👫","💰","🎭"],["Golmaal","😂","🔄","👬"],["Hera Pheri","💰","☎️","😂"],["Bhool Bhulaiyaa","🏰","🌀","👻"],["Stree","👩","👻","🌙"],["Dhoom","🏍️","💨","👮"],["Singham","🦁","👮","💪"],["Tiger Zinda Hai","🐅","❤️","💪"],["Bade Miyan Chote Miyan","👨","👦","👬"],["Mr. India","👨","🇮🇳","👻"],["Dil Chahta Hai","❤️","👬","🏖️"],["Zindagi Na Milegi Dobara","🌍","🚗","🪂"]];
const $=id=>document.getElementById(id);let i=0,n=0,timer=null,answered=false,audio;function beep(win=false){try{audio ||=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=win?880:400+n*80;g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.start();o.stop(audio.currentTime+.22)}catch(e){}}function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ Start / resume'}function controls(){ $('play').disabled=$('one').disabled=answered||n>=movies[i].length-1;$('show').disabled=answered}function load(){stop();n=0;answered=false;$('round').textContent=(i+1)+' / '+movies.length;$('answer').textContent='Can you guess the Bollywood movie?';$('stage').replaceChildren(...movies[i].slice(1).map(()=>{let d=document.createElement('div');d.className='tile';d.textContent='?';return d}));controls()}function step(){if(answered||n>=movies[i].length-1){stop();return}let d=$('stage').children[n];d.textContent=movies[i][++n];d.classList.add('open');beep();if(n>=movies[i].length-1)stop();controls()}function toggle(){if(timer){stop();return}step();if(n<movies[i].length-1&&!answered){timer=setInterval(step,2000);$('play').textContent='Ⅱ Pause'}}function show(){stop();while(n<movies[i].length-1)step();answered=true;$('answer').textContent=movies[i][0];beep(true);controls()}function next(){if(i<movies.length-1){i++;load()}else if(confirm('Challenge complete! Play again?')){i=0;load()}}function full(){if(document.fullscreenElement)document.exitFullscreen?.();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else alert('Rotate your iPhone to landscape for a larger view.')}document.addEventListener('keydown',e=>{if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='r')step();if(e.key.toLowerCase()==='a')show();if(e.key.toLowerCase()==='n')next();if(e.key.toLowerCase()==='f')full()});load();</script><script src="party-music.js"></script></body></html>
