<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday Kiaan!</title><style>*{box-sizing:border-box}body{margin:0;background:#142b38;color:white;font:bold 18px system-ui;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}main{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:5vw;pointer-events:none}#tag{font-size:clamp(18px,3vw,48px);letter-spacing:.18em;color:#fff3a2;text-shadow:3px 3px #26361c}h1{font-size:clamp(44px,10vw,155px);line-height:.98;margin:.18em 0;color:#fff4a1;text-shadow:0 5px #a77b27,0 10px #503a21,5px 12px #172b20;animation:bob 5s ease-in-out infinite}#sub{font-size:clamp(20px,4vw,65px);color:white;text-shadow:3px 4px #233b24}nav{position:fixed;bottom:12px;right:12px;display:flex;gap:8px;z-index:5}button,a{font:bold 14px system-ui;background:#ffe36b;color:#192a17;border:0;border-radius:6px;padding:10px;text-decoration:none;cursor:pointer}nav.quiet{opacity:.12}nav:hover,nav:focus-within{opacity:1}@keyframes bob{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){h1{animation:none}}main{overflow:hidden}h1{font-size:clamp(32px,7.2vw,115px);max-width:92vw;overflow-wrap:break-word}#tag{letter-spacing:.09em}#sub{font-size:clamp(16px,3vw,48px)}</style></head><body><canvas id="scene" aria-hidden="true"></canvas><main><div id="tag">LEVEL 7 UNLOCKED</div><h1 id="headline">HAPPY BIRTHDAY<br>KIAAN!</h1><div id="sub">A NEW ADVENTURE BEGINS</div></main><nav id="controls"><a href="./">Home</a><button onclick="full()">Fullscreen</button><button onclick="paused=!paused;this.textContent=paused?'Resume':'Pause'">Pause</button></nav><script>
const c=document.getElementById('scene'),g=c.getContext('2d');let w,h,paused=false,t=0,last=0,shown=-1;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function resize(){w=c.width=innerWidth;h=c.height=innerHeight}addEventListener('resize',resize);resize();const messages=[["WELCOME, EVERYONE!","WELCOME TO KIAAN'S<br>7TH BIRTHDAY PARTY","WE'RE SO HAPPY YOU'RE HERE"],["TODAY IS A SPECIAL DAY","HAPPY 7TH BIRTHDAY<br>KIAAN!","LET'S MAKE AMAZING MEMORIES"],["MINECRAFT BIRTHDAY ADVENTURE","LEVEL 7<br>UNLOCKED!","A NEW ADVENTURE BEGINS"],["LET THE CELEBRATION BEGIN","KIAAN<br>IS 7!","BUILD • PLAY • CELEBRATE"],["A BIG WELCOME TO ALL OUR GUESTS","LET'S PARTY!","FUN • FRIENDS • FAMILY"],["CELEBRATING OUR BIRTHDAY SUPERSTAR","HAPPY BIRTHDAY<br>KIAAN!","WISHING YOU A WORLD OF ADVENTURES"],["THANK YOU FOR BEING HERE","LET'S MAKE<br>MEMORIES!","TOGETHER WE MAKE TODAY SPECIAL"],["READY FOR ADVENTURE?","WELCOME TO<br>KIAAN'S WORLD!","LEVEL 7 • LET THE FUN BEGIN"]];const particles=Array.from({length:75},(_,i)=>({x:Math.random(),y:Math.random(),v:.02+Math.random()*.045,s:5+Math.random()*12,col:['#f9dc55','#73df85','#75e9ee','#f58c76','#fff2bd'][i%5]}));function rect(x,y,a,b,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.ceil(a),Math.ceil(b))}function block(x,y,s,col){rect(x,y,s,s,col);rect(x,y,s,s*.16,'#ffffff44');rect(x+s*.8,y,s*.2,s,'#00000033')}function tree(x,y,s){rect(x+s,y+s*2,s,s*3,'#795034');for(let j=0;j<3;j++)for(let i=0;i<3;i++)block(x+i*s,y+j*s,s,['#397c3d','#4d9b46','#68ad4a'][(i+j)%3])}function mob(x,y,s,pig){const col=pig?'#e99ca5':'#68ad48';block(x,y,s*3,col);rect(x+s*.5,y+s*.65,s*.55,s*.55,'#203522');rect(x+s*1.95,y+s*.65,s*.55,s*.55,'#203522');if(pig){rect(x+s*.85,y+s*1.55,s*1.3,s*.8,'#bd6877');rect(x+s,y+s*1.8,s*.3,s*.25,'#713d49');rect(x+s*1.7,y+s*1.8,s*.3,s*.25,'#713d49')}else{rect(x+s,y+s*1.2,s,s*.65,'#203522');rect(x+s*.65,y+s*1.8,s*1.7,s*.85,'#203522');rect(x+s,y+s*2.35,s,s*.35,col)}}function draw(){const sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#28668e');sky.addColorStop(1,'#a4d8ce');g.fillStyle=sky;g.fillRect(0,0,w,h);const s=Math.max(16,Math.floor(w/40));rect(w*.83,h*.08,s*3,s*3,'#fff0b3');for(let i=0;i<5;i++){let x=((i*w*.27+t*9)%(w+s*9))-s*5,y=h*(.09+(i%3)*.08);rect(x,y,s*5,s,'#e6f3ed');rect(x+s,y-s,s*3,s,'#e6f3ed')}for(let i=0;i<Math.ceil(w/s);i++){const top=h*.75+Math.floor(2*Math.sin(i*.5))*s;rect(i*s,top,s,h-top,'#805838');rect(i*s,top,s,s*.45,'#76b94c');rect(i*s+s*.15,top+s*.8,s*.25,s*.3,'#9b7049')}tree(w*.035,h*.49,s);tree(w*.86,h*.46,s);mob(w*.08,h*.76,s*.8,false);mob(w*.82,h*.76,s*.8,true);for(const p of particles){let y=((p.y+t*p.v)%1)*h;block(p.x*w,y,p.s,p.col)}for(let k=0;k<3;k++){let phase=(t*.22+k*.34)%1;let x=w*(.18+k*.32),y=h*.19;g.globalAlpha=Math.sin(phase*Math.PI)*.75;for(let j=0;j<12;j++){let a=j*Math.PI/6;block(x+Math.cos(a)*phase*s*5,y+Math.sin(a)*phase*s*5,s*.25,['#ffe36b','#fca5a5','#c0f7e1'][k])}g.globalAlpha=1}rect(0,0,w,h,'#102b2233')}function frame(now){if(!last)last=now;if(!paused&&!reduced)t+=Math.min(.05,(now-last)/1000);last=now;const k=Math.floor(t/10)%messages.length;if(k!==shown){shown=k;const m=messages[k];document.getElementById('tag').textContent=m[0];document.getElementById('headline').innerHTML=m[1];document.getElementById('sub').textContent=m[2];if(!reduced)document.querySelector('main').animate([{opacity:0,transform:'translateX(35px)'},{opacity:1,transform:'translateX(0)'}],{duration:850,easing:'ease-out'});}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);function full(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})}let idle;function wake(){document.getElementById('controls').classList.remove('quiet');clearTimeout(idle);idle=setTimeout(()=>document.getElementById('controls').classList.add('quiet'),4000)}addEventListener('pointermove',wake);addEventListener('pointerdown',wake);wake();</script><script src="party-music.js?v=14"></sc
