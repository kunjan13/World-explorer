<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beat the Clock</title><style>*{box-sizing:border-box}body{margin:0;background:#102b22;color:white;font:bold 16px system-ui;text-align:center}main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:12px;max-width:1600px;margin:auto}header{font-size:clamp(22px,4vw,42px);color:#ffe36b}#stage{flex:1;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#193d2b;border:5px solid #85b84c;padding:16px;gap:12px}#item{font-size:clamp(28px,6vw,90px);overflow-wrap:anywhere}#clock{font-size:clamp(80px,19vw,220px);line-height:1;font-variant-numeric:tabular-nums;color:#ffe36b}#clock.urgent{color:#ff7878}#status{font-size:clamp(18px,3vw,36px);color:#d9efcb}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}button,a{font:inherit;border:0;border-radius:6px;padding:12px;background:#e6bf43;color:#192a17;text-decoration:none;cursor:pointer}button:disabled{opacity:.45}dialog{background:#234c32;color:white;border:3px solid #85b84c;border-radius:12px;width:min(94vw,680px);max-height:90vh;overflow:auto;text-align:left;padding:20px}dialog::backdrop{background:#000b}textarea,input{font:inherit;width:100%;padding:10px;border-radius:6px;border:1px solid #aaa;margin:8px 0 14px}textarea{min-height:220px}label{display:block}small{font-weight:normal}#progress{height:12px;background:#355a3b;width:90%;border-radius:8px;overflow:hidden}#bar{height:100%;background:#ffe36b;transition:width .15s}</style></head><body><main><header>BEAT THE CLOCK · <span id="round"></span></header><div id="stage"><div id="status">Ready for the challenge?</div><div id="item">Mystery item</div><div id="clock">30</div><div id="progress"><div id="bar"></div></div></div><nav><button id="play" onclick="toggle()">▶ Start</button><button onclick="reset()">Reset timer</button><button onclick="next()">Next item →</button><button onclick="configure()">⚙ Configure</button><button onclick="full()">Fullscreen</button><a href="./">Home</a><a href="emoji.html">Movies</a></nav></main><dialog id="settings"><h2>Configure challenges</h2><label>Items (one per line; optional duration after |)<textarea id="items"></textarea></label><small>Example: Lipstick | 20</small><label>Default seconds<input id="duration" type="number" min="5" max="300" value="30"></label><label>Quick challenge (optional)<input id="quick" placeholder="Type a new item to play immediately"></label><div id="error" role="alert"></div><nav><button onclick="save(false)">Save list</button><button onclick="save(true)">Play quick challenge</button><button onclick="$('settings').close()">Cancel</button></nav></dialog><script>
const $=id=>document.getElementById(id);const defaults=['₹1 note','₹10 coin','Lipstick','Handkerchief','A blue pen','A wristwatch','A hair clip','A keychain','A clean tissue','A business card','A pair of sunglasses','Something green'];let items=defaults.map(text=>({text,seconds:null})),duration=30;try{const saved=JSON.parse(localStorage.getItem('beat-clock-v1'));if(saved&&Array.isArray(saved.items)&&saved.items.length){items=saved.items;duration=saved.duration}}catch(e){}let i=0,override=null,remaining=30,total=30,timer=null,deadline=0,started=false,finished=false,audio,lastTick=-1;function tone(f=550,len=.12){try{audio ||=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+len);o.start();o.stop(audio.currentTime+len)}catch(e){}}function current(){return override||items[i]}function stop(){clearInterval(timer);timer=null;$('play').textContent=started?'▶ Resume':'▶ Start'}function render(){let s=Math.ceil(remaining/1000);$('clock').textContent=s;$('clock').classList.toggle('urgent',s<=5);$('bar').style.width=Math.max(0,remaining/(total*1000)*100)+'%';$('play').disabled=finished}function reset(){stop();started=false;finished=false;total=current().seconds||duration;remaining=total*1000;lastTick=-1;$('round').textContent=override?'QUICK CHALLENGE':(i+1)+' / '+items.length;$('item').textContent='Mystery item';$('status').textContent='Ready? Walk safely and ask before borrowing.';$('play').textContent='▶ Start';render()}function tick(){remaining=Math.max(0,deadline-Date.now());const s=Math.ceil(remaining/1000);if(s!==lastTick&&s<=5&&s>0){tone(700);lastTick=s}if(!remaining){stop();finished=true;$('status').textContent='TIME’S UP!';tone(220,.8)}render()}function toggle(){if(finished)return;if(timer){tick();stop();if(!finished)$('status').textContent='PAUSED';return}started=true;$('item').textContent=current().text;$('status').textContent='FIND AND BRING IT!';tone();deadline=Date.now()+remaining;timer=setInterval(tick,80);$('play').textContent='Ⅱ Pause';tick()}function next(){if(override){override=null}else{i=(i+1)%items.length}reset()}function configure(){if(timer){tick();stop();if(!finished)$('status').textContent='PAUSED'}$('items').value=items.map(x=>x.text+(x.seconds?' | '+x.seconds:'')).join('\n');$('duration').value=duration;$('quick').value='';$('error').textContent='';$('settings').showModal()}function save(quick){const d=Number($('duration').value);if(!Number.isInteger(d)||d<5||d>300){$('error').textContent='Choose 5–300 seconds.';return}const list=[];for(const line of $('items').value.split('\n').map(s=>s.trim()).filter(Boolean)){const parts=line.split('|');const text=parts[0].trim();const sec=parts.length>1?Number(parts[1].trim()):null;if(!text||parts.length>2||(sec!==null&&(!Number.isInteger(sec)||sec<5||sec>300))){$('error').textContent='Check item and duration: '+line;return}list.push({text,seconds:sec})}const q=$('quick').value.trim();if(!list.length||quick&&!q){$('error').textContent='Enter at least one item and a quick challenge if needed.';return}items=list;duration=d;i=0;override=quick?{text:q,seconds:null}:null;try{localStorage.setItem('beat-clock-v1',JSON.stringify({items,duration}))}catch(e){}$('settings').close();reset();if(quick)toggle()}function full(){if(document.fullscreenElement)document.exitFullscreen?.();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else alert('Rotate to landscape for a larger view.')}document.addEventListener('keydown',e=>{if($('settings').open||e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='n')next();if(e.key.toLowerCase()==='f')full()});reset();</script><script src="party-music.js?v=11"></script></body></html>
